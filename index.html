<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <section class="main">
        <nav class="top-nav">
                <h2>Newpay</h2>
                <div class="other">
                    <button class="support">support</button>
                    <button class="rewards">Rewards</button>
                </div>
        </nav>
        <section class="money">
            <div class="amount">
                <div class="balance">
                    <h1>$200,123.98</h1>
                </div>
                <div class="saved-balance">
                    <p>Money hold $2,455</p>
                </div>
            </div>
        </section>
        <section class="send-and-history">
            <div class="send-receive">
                <button type="button" class="send">send</button>
                <button type="button" class="receive">Receive</button>
            </div>
            <div class="favourite">
                <div class="send-again div-nav">
                    <p>Send again</p>
                    <button type="button">+ Add</button>

                </div>
                <div class="favourite-contact">
                    <div class="contact-a">
                        <img src="" alt="contact-a-profile">
                        <div class="activity">send</div>
                    </div>
                    <div class="contact-b">
                        <img src="" alt="contact-b-profile">
                        <div class="activity">receive</div>
                    </div>
                    <div class="contact-c">
                        <img src="" alt="contact-c-profile">
                        <div class="activity">dollar</div>
                    </div>
                    <div class="contact-d">
                        <img src="" alt="contact-d-profile">
                        <div class="activity">sub</div>
                    </div>
                    <div class="contact-e">
                        <img src="" alt="contact-a-profile">
                        <div class="activity">send</div>
                    </div>
                </div>
            </div>
            <div class="transcation-history">
                <div class="transcation-history-nav">
                    <p>History transaction</p>
                    <button type="button">see more</button>
                </div>
                <div class="history">
                    <div class="history-a">
                        <div class="profile-details">
                            <img src="" alt="">
                            <div class="trans-details">
                                <h3 class="name">Dribble Pro</h3>
                                <p class="date-time">June 28 .00:01 AM</p>
                            </div>
                        </div>
                        <div class="transcation-amount">
                            <p>- $573</p>
                        </div>
                    </div>
                    <div class="history-b">
                        <div class="profile-details">
                            <img src="" alt="">
                            <div class="trans-details">
                                <h3 class="name">Syaiful Rjial</h3>
                                <p class="date-time">June 22 .05:20 PM</p>
                            </div>
                        </div>
                        <div class="transcation-amount">
                            <p>+ $1000</p>
                        </div>
                    </div>
                    <div class="history-c">
                        <div class="profile-details">
                            <img src="" alt="">
                            <div class="trans-details">
                                <h3 class="name">Radical Nerd</h3>
                                <p class="date-time">June 12 .07:20 AM</p>
                            </div>
                        </div>
                        <div class="transcation-amount">
                            <p>-$273</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </section>
</body>
</html>
