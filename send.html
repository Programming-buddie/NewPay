<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="send.css" />
    <link rel="stylesheet" href="fontawesome-free-7.1.0-web/css/all.css" />
    <script src="send.js" defer></script>
    <title>Document</title>
  </head>
  <body>
    <section class="send-main">
      <nav class="top-nav div-nav">
        <button class="back"><i class="fas fa-arrow-left"></i></button>
        <h4>Send money</h4>
        <button class="support"><i class="far fa-question-circle"></i></button>
      </nav>
      <div class="send-to">
        <div class="div-nav">
          <h4>Send to</h4>
          <hr />
        </div>
        <div class="history-a history-sec">
          <div class="send-to-details">

            <div class="contact-a favor">
              <img src="img/user/IMG_3516.JPG" alt="contact-a-profile" />
              <div class="activity"><i class="fab fa-bitcoin"></i></div>
            </div>

            <div class="trans-details">
                                    <h3 class="name">Dribble Pro</h3>
                                    <p class="date-time">1234567890</p>
                                </div>
          </div>
          <div class="transcation-amount change-button">
            <button type="button">Change</button>
          </div>
        </div>
      </div>
      <section class="amount-input">
        <input
          type="number"
          name="amout-to-send"
          id="amount-to-send"
          placeholder="10.00 --- 50,000"
        />
      </section>
    </section>
  </body>
</html>
